seed: 2026050704
debug_timing: true

pairwise:
  num_questions: 20
  enabled: false
  max_pairs_per_question: 0
  elo_k_factor: 24.0
  elo_initial_rating: 1000.0

generator:
  api_provider: "openai"
  api_model: "Qwen/Qwen3-8B-Base"
  api_base_url: "https://api.together.xyz/v1"
  api_key_env: "TOGETHER_API_KEY"
  api_endpoint: "completions"
  api_max_tokens_param: "max_tokens"
  api_timeout_s: 120
  api_min_interval_s: 0.0
  api_max_retries: 2
  api_backoff_initial_s: 1.0
  api_max_parallel: 8
  use_chat_template: false
  enable_thinking: false
  prompt_template_path: "grpo_math/prompts/question_generator_prompt.txt"
  question_bank:
    enabled: true
    path: "examples.json"
    num_examples: 2
    compatible_only: false
    recent_jsonl_path: "outputs/pairwise_rollouts_debug/samples_qwen35_9b_together_single_verify_inspect_10q.jsonl"
    recent_num_examples: 2
  temperature: 1.05
  top_p: 0.9
  max_new_tokens: 1024
  batch_size: 1
  max_retries_per_question: 3
  prompt_suffix: ""

solver:
  api_provider: "openai"
  api_model: "Qwen/Qwen3.5-9B"
  api_base_url: "https://api.together.xyz/v1"
  api_key_env: "TOGETHER_API_KEY"
  api_reasoning_effort: ""
  api_max_tokens_param: "max_tokens"
  api_extra_body:
    chat_template_kwargs:
      enable_thinking: true
      thinking_budget: 512
  include_reasoning_in_output: true
  api_final_max_tokens: 256
  api_final_prefill: "FINAL_ANSWER: "
  api_timeout_s: 300
  api_min_interval_s: 0.0
  api_max_retries: 2
  api_backoff_initial_s: 0.5
  api_max_parallel: 12
  use_chat_template: false
  enable_thinking: true
  num_solutions_per_question: 2
  sampling_groups:
    - count: 1
      temperature: 0.2
      top_p: 0.85
    - count: 1
      temperature: 1.0
      top_p: 1.0
  prompt_template: |
    Question:
    {question}

    Think through the solution. When you begin the final response, output exactly one line:
    FINAL_ANSWER: <final answer>
    Do not include any explanation after FINAL_ANSWER.
  temperature: 1.0
  top_p: 0.95
  max_new_tokens: 4096
  batch_size: 1
  batch_across_questions: true

judge:
  mode: "single_verify"
  batch_verify_all_solutions: false
  verify_prompt_template_path: "grpo_math/prompts/single_solution_verify_prompt.txt"
  api_provider: "openai"
  api_model: "Qwen/Qwen3.5-9B"
  api_base_url: "https://api.together.xyz/v1"
  api_key_env: "TOGETHER_API_KEY"
  api_reasoning_effort: ""
  api_max_tokens_param: "max_tokens"
  api_extra_body:
    chat_template_kwargs:
      enable_thinking: false
  api_timeout_s: 300
  api_min_interval_s: 0.0
  api_max_retries: 2
  api_backoff_initial_s: 0.5
  api_max_parallel: 8
  use_chat_template: false
  enable_thinking: false
  prompt_template_path: "grpo_math/prompts/pairwise_judge_prompt.txt"
  repeats_per_pair: 1
  repeats_per_solution: 2
  temperature: 0.2
  top_p: 1.0
  max_new_tokens: 4096
  batch_size: 1
  python_assisted: true
  python_timeout_s: 5

output:
  include_judge_traces: true
  jsonl_path: "outputs/pairwise_rollouts_debug/samples_qwen3_8b_base_together_single_verify_inspect_20q.jsonl"
  write_mode: "overwrite"

strong_verifier:
  enabled: false
