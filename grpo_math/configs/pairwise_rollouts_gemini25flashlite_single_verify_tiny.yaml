seed: 20260507
debug_timing: true

pairwise:
  num_questions: 3
  enabled: false
  max_pairs_per_question: 0
  elo_k_factor: 24.0
  elo_initial_rating: 1000.0

generator:
  api_provider: "openai"
  api_model: "gemini-2.5-flash-lite"
  api_base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
  api_key_env: "GEMINI_API_KEY"
  api_reasoning_effort: "none"
  api_max_tokens_param: "max_tokens"
  api_timeout_s: 90
  api_min_interval_s: 0.5
  api_max_retries: 8
  api_backoff_initial_s: 1.0
  api_max_parallel: 1
  use_chat_template: false
  enable_thinking: false
  prompt_template_path: "grpo_math/prompts/question_generator_prompt.txt"
  question_bank:
    enabled: true
    path: "examples.json"
    num_examples: 8
    compatible_only: false
  temperature: 1.05
  top_p: 0.9
  max_new_tokens: 384
  batch_size: 1
  max_retries_per_question: 8
solver:
  api_provider: "openai"
  api_model: "gemini-2.5-flash-lite"
  api_base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
  api_key_env: "GEMINI_API_KEY"
  api_reasoning_effort: "none"
  api_max_tokens_param: "max_tokens"
  api_timeout_s: 90
  api_min_interval_s: 0.0
  api_max_retries: 8
  api_backoff_initial_s: 0.5
  api_max_parallel: 12
  use_chat_template: false
  enable_thinking: false
  num_solutions_per_question: 4
  sampling_groups:
    - count: 2
      temperature: 0.2
      top_p: 0.85
    - count: 2
      temperature: 1.4
      top_p: 1.0
  prompt_template: |
    Question:
    {question}

    Solve step by step. Use plain text only, no markdown.
    Keep your reasoning concise, but use enough steps to be checkable.
    Your last line must be exactly:
    FINAL_ANSWER: <final answer>
  temperature: 1.0
  top_p: 0.95
  max_new_tokens: 10000
  batch_size: 1
  batch_across_questions: true

judge:
  mode: "single_verify"
  batch_verify_all_solutions: false
  verify_prompt_template_path: "grpo_math/prompts/single_solution_verify_prompt.txt"
  api_provider: "openai"
  api_model: "gemini-2.5-flash"
  api_base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
  api_key_env: "GEMINI_API_KEY"
  api_reasoning_effort: "none"
  api_max_tokens_param: "max_tokens"
  api_timeout_s: 90
  api_min_interval_s: 0.0
  api_max_retries: 8
  api_backoff_initial_s: 0.5
  api_max_parallel: 12
  use_chat_template: false
  enable_thinking: false
  prompt_template_path: "grpo_math/prompts/pairwise_judge_prompt.txt"
  repeats_per_pair: 1
  repeats_per_solution: 3
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 10000
  batch_size: 1
  python_assisted: true
  python_timeout_s: 5

output:
  include_judge_traces: true
  jsonl_path: "outputs/pairwise_rollouts_debug/samples_gemini25flashlite_single_verify_tiny.jsonl"
  write_mode: "overwrite"

strong_verifier:
  enabled: false
