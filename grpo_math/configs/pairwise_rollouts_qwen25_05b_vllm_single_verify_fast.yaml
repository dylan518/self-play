seed: 1234
debug_timing: true

pairwise:
  num_questions: 5
  max_pairs_per_question: 0
  elo_k_factor: 24.0
  elo_initial_rating: 1000.0

generator:
  api_provider: "openai"
  api_model: "Qwen/Qwen2.5-0.5B-Instruct"
  api_base_url: "http://127.0.0.1:8000/v1"
  api_key: "EMPTY"
  api_max_tokens_param: "max_tokens"
  api_timeout_s: 180
  api_min_interval_s: 0.0
  api_max_retries: 8
  api_backoff_initial_s: 0.5
  api_max_parallel: 8
  use_chat_template: false
  enable_thinking: false
  prompt_template_path: "grpo_math/prompts/question_generator_prompt.txt"
  temperature: 1.0
  top_p: 0.9
  max_new_tokens: 512
  batch_size: 1
  max_retries_per_question: 10

solver:
  api_provider: "openai"
  api_model: "Qwen/Qwen2.5-0.5B-Instruct"
  api_base_url: "http://127.0.0.1:8000/v1"
  api_key: "EMPTY"
  api_max_tokens_param: "max_tokens"
  api_timeout_s: 180
  api_min_interval_s: 0.0
  api_max_retries: 8
  api_backoff_initial_s: 0.5
  api_max_parallel: 64
  use_chat_template: false
  enable_thinking: false
  num_solutions_per_question: 10
  sampling_groups:
    - count: 5
      temperature: 0.3
      top_p: 0.9
    - count: 5
      temperature: 1.1
      top_p: 0.95
  prompt_template: |
    Question:
    {question}

    Solve step by step in plain text only.
    Keep your response concise.
    Your last line must be exactly:
    FINAL_ANSWER: <integer>
  temperature: 1.0
  top_p: 0.95
  max_new_tokens: 2048
  batch_size: 1
  batch_across_questions: true

judge:
  mode: "single_verify"
  batch_verify_all_solutions: false
  verify_prompt_template_path: "grpo_math/prompts/single_solution_verify_prompt.txt"
  api_provider: "openai"
  api_model: "Qwen/Qwen2.5-0.5B-Instruct"
  api_base_url: "http://127.0.0.1:8000/v1"
  api_key: "EMPTY"
  api_max_tokens_param: "max_tokens"
  api_timeout_s: 180
  api_min_interval_s: 0.0
  api_max_retries: 8
  api_backoff_initial_s: 0.5
  api_max_parallel: 64
  use_chat_template: false
  enable_thinking: false
  prompt_template_path: "grpo_math/prompts/pairwise_judge_prompt.txt"
  repeats_per_pair: 1
  repeats_per_solution: 2
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 256
  batch_size: 1

output:
  include_judge_traces: true
  jsonl_path: "outputs/pairwise_rollouts_debug/samples_qwen25_05b_vllm_single_verify_fast.jsonl"
  write_mode: "overwrite"

strong_verifier:
  enabled: true
  provider: "openai"
  model: "gpt-5.2"
  base_url: "https://api.openai.com/v1"
  timeout_s: 90
  oracle_max_tokens: 1024
