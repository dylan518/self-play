seed: 1234

model:
  name_or_path: "meta-llama/Llama-3.1-8B-Instruct"
  torch_dtype: "bfloat16"
  use_flash_attn: true

data:
  source: "pairwise_jsonl"
  jsonl_path: "outputs/pairwise_rollouts_debug/samples_qwen25_05b_vllm_single_verify_fast.jsonl"
  split_train: "train"
  split_eval: "eval"
  eval_fraction: 0.2

prompt:
  template: |
    Question:
    {question}

    Solve step by step in plain text only.
    Keep your response concise.
    Your last line must be exactly:
    FINAL_ANSWER: <integer>

reward:
  mode: "verdict"
  teacher:
    verify_prompt_template_path: "grpo_math/prompts/single_solution_verify_prompt.txt"
    api_model: "Qwen/Qwen2.5-0.5B-Instruct"
    api_base_url: "http://127.0.0.1:8000/v1"
    api_key: "EMPTY"
    api_max_tokens_param: "max_tokens"
    api_timeout_s: 120
    api_max_retries: 8
    api_backoff_initial_s: 0.5
    temperature: 0.0
    top_p: 1.0
    max_new_tokens: 128

rollout:
  k: 2
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 512

train:
  output_dir: "outputs/trl_grpo_pairwise_verdict_llama31_8b_lora_smoke"
  steps: 1
  prompts_per_step: 4
  grad_accum_steps: 1

  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    bias: "none"
    target_modules: "all-linear"

  lr: 1.0e-5
  warmup_steps: 0
  kl_beta: 0.01

  gradient_checkpointing: true
  eval_every: 0
  save_every: 1

  wandb:
    enabled: true
    project: "grpo-math"
    run_name: "trl-grpo-pairwise-verdict-llama31-8b-lora-smoke"

  debug_rollouts:
    enabled: false
