seed: 1234

model:
  name_or_path: "sshleifer/tiny-gpt2"
  torch_dtype: "float32"
  use_flash_attn: false

data:
  train_jsonl_paths:
    - "tests/fixtures/solver_verdict_rollouts.jsonl"
  eval_jsonl_paths:
    - "tests/fixtures/solver_verdict_rollouts.jsonl"
  max_train_samples: 8
  max_eval_samples: 4

prompt:
  template: |
    Question:
    {question}

    You must solve step by step, then output the final answer on its own line as:
    FINAL_ANSWER: <number>

rollout:
  k: 2
  temperature: 0.7
  top_p: 0.95
  max_new_tokens: 64

verifier:
  provider: "fixture"
  prompt_version: "solver_verdict_grpo_v1"
  python_assisted: true
  python_timeout_s: 5
  cache_path: "outputs/verifier_cache/solver_verdict_grpo_smoke.jsonl"
  fixture_map:
    "FINAL_ANSWER: 4": "CORRECT"
    "FINAL_ANSWER: 5": "INCORRECT"
    "no final answer": "INVALID"

train:
  output_dir: "outputs/solver_verdict_grpo_smoke"
  steps: 1
  prompts_per_step: 2
  grad_accum_steps: 1
  lr: 1.0e-5
  warmup_steps: 0
  weight_decay: 0.0
  max_grad_norm: 1.0
  kl_beta: 0.01
  gradient_checkpointing: false
  log_every: 1
  eval_every: 0
  save_every: 1
  wandb:
    enabled: false
    project: "grpo-math"
    run_name: "solver-verdict-grpo-smoke"
  debug_rollouts:
    enabled: false
