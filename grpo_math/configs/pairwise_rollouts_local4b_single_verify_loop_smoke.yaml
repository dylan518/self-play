seed: 2026051001
debug_timing: true

pairwise:
  num_questions: 5
  enabled: false
  max_pairs_per_question: 0
  elo_k_factor: 24.0
  elo_initial_rating: 1000.0

question_reward:
  lambda_verifiability: 0.35
  confirm_soft_reward: 0.2

generator:
  api_provider: "openai"
  api_model: "Qwen/Qwen3.5-9B"
  api_tokenizer_name_or_path: "Qwen/Qwen3.5-9B"
  api_base_url: "http://127.0.0.1:8001/v1"
  api_key: "EMPTY"
  api_reasoning_effort: ""
  api_max_tokens_param: "max_tokens"
  api_extra_body:
    chat_template_kwargs:
      enable_thinking: false
  api_timeout_s: 120
  api_min_interval_s: 0.0
  api_max_retries: 4
  api_backoff_initial_s: 1.0
  api_max_parallel: 1
  use_chat_template: false
  enable_thinking: false
  prompt_template_path: "grpo_math/prompts/question_generator_prompt.txt"
  question_bank:
    enabled: true
    path: "examples_gemini31flashlite_preview_nocategory_30.json"
    num_examples: 8
    seed: 4321
    compatible_only: false
  temperature: 1.15
  top_p: 0.95
  max_new_tokens: 512
  batch_size: 1
  max_retries_per_question: 1

solver:
  api_provider: "openai"
  api_model: "Qwen/Qwen3.5-9B"
  api_tokenizer_name_or_path: "Qwen/Qwen3.5-9B"
  api_base_url: "http://127.0.0.1:8001/v1"
  api_key: "EMPTY"
  api_reasoning_effort: ""
  api_max_tokens_param: "max_tokens"
  api_extra_body:
    chat_template_kwargs:
      enable_thinking: true
      thinking_budget: 512
  include_reasoning_in_output: true
  api_final_max_tokens: 1024
  api_final_prefill: "FINAL_ANSWER: "
  api_timeout_s: 180
  api_min_interval_s: 0.0
  api_max_retries: 4
  api_backoff_initial_s: 0.5
  api_max_parallel: 2
  use_chat_template: false
  enable_thinking: false
  num_solutions_per_question: 8
  sampling_groups:
    - count: 8
      temperature: 1.5
      top_p: 0.98
  prompt_template: |
    Question:
    {question}

    Think through the solution, then when you begin the final response, put the answer first.
    The final response must start with this exact line:
    FINAL_ANSWER: <final answer>
    After that line, you may include a brief check if needed.
  temperature: 1.0
  top_p: 0.95
  max_new_tokens: 4096
  batch_size: 1
  batch_across_questions: true

judge:
  mode: "single_verify"
  batch_verify_all_solutions: false
  verify_prompt_template_path: "grpo_math/prompts/single_solution_verify_prompt.txt"
  api_provider: "openai"
  api_model: "Qwen/Qwen3.5-9B"
  api_base_url: "http://127.0.0.1:8001/v1"
  api_key: "EMPTY"
  api_reasoning_effort: ""
  api_max_tokens_param: "max_tokens"
  api_extra_body:
    chat_template_kwargs:
      enable_thinking: false
  api_timeout_s: 180
  api_min_interval_s: 0.0
  api_max_retries: 4
  api_backoff_initial_s: 0.5
  api_max_parallel: 2
  use_chat_template: false
  enable_thinking: false
  prompt_template_path: "grpo_math/prompts/pairwise_judge_prompt.txt"
  repeats_per_pair: 1
  repeats_per_solution: 3
  verify_sample_size: 3
  temperature: 0.3
  top_p: 0.95
  max_new_tokens: 1024
  batch_size: 1
  python_assisted: true
  python_timeout_s: 5

output:
  include_judge_traces: true
  jsonl_path: "outputs/pairwise_rollouts_debug/samples_local4b_single_verify_loop_smoke.jsonl"
  write_mode: "overwrite"

strong_verifier:
  enabled: false
