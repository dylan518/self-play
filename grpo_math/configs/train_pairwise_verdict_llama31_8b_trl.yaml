seed: 1234

model:
  name_or_path: "meta-llama/Llama-3.1-8B-Instruct"
  torch_dtype: "bfloat16"
  use_flash_attn: true

data:
  source: "pairwise_jsonl"
  jsonl_path: "outputs/pairwise_rollouts_debug/samples_llama31_8b_vllm_single_verify_fast.jsonl"
  split_train: "train"
  split_eval: "eval"
  eval_fraction: 0.2

prompt:
  template: |
    Question:
    {question}

    Solve step by step in plain text only.
    Keep your response concise.
    Your last line must be exactly:
    FINAL_ANSWER: <integer>

reward:
  mode: "verdict"
  teacher:
    verify_prompt_template_path: "grpo_math/prompts/single_solution_verify_prompt.txt"
    api_model: "meta-llama/Llama-3.1-8B-Instruct"
    api_base_url: "http://127.0.0.1:8001/v1"
    api_key: "EMPTY"
    api_max_tokens_param: "max_tokens"
    api_timeout_s: 180
    api_max_retries: 8
    api_backoff_initial_s: 0.5
    temperature: 0.0
    top_p: 1.0
    max_new_tokens: 256

rollout:
  k: 4
  temperature: 0.7
  top_p: 0.95
  max_new_tokens: 1024

train:
  output_dir: "outputs/trl_grpo_pairwise_verdict_llama31_8b"
  steps: 300
  prompts_per_step: 16
  grad_accum_steps: 1

  lr: 4.0e-6
  warmup_steps: 30
  kl_beta: 0.005

  gradient_checkpointing: true
  eval_every: 25
  save_every: 50

  wandb:
    enabled: true
    project: "grpo-math"
    run_name: "trl-grpo-pairwise-verdict-llama31-8b"

  debug_rollouts:
    enabled: true
    max_prompts: 4
