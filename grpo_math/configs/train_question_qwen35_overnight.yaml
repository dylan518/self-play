seed: 4321

model:
  name_or_path: "Qwen/Qwen3.5-9B"
  torch_dtype: "bfloat16"
  use_flash_attn: true

data:
  source: "rollout_rewards"
  jsonl_path: ""
  min_reward_gap: 0.05
  max_pairs_per_group: 512
  question_bank_path: "examples_gemini31flashlite_preview_nocategory_30.json"
  num_examples: 8
  question_bank_seed: 4321
  compatible_only: false
  num_prompts: 32
  num_eval_prompts: 4
  split_train: "train"
  split_eval: "eval"
  eval_fraction: 0.0

prompt:
  template_path: "grpo_math/prompts/question_generator_prompt.txt"

reward:
  mode: "rollout_rewards"

rollout:
  k: 4
  temperature: 1.1
  top_p: 0.95
  max_new_tokens: 512

train:
  output_dir: "outputs/trl_grpo_question_qwen35_overnight"
  steps: 25
  prompts_per_step: 8
  grad_accum_steps: 1
  lora:
    enabled: true
    r: 8
    alpha: 16
    dropout: 0.05
    bias: "none"
    target_modules: "all-linear"
  lr: 5.0e-5
  warmup_steps: 0
  kl_beta: 0.01
  dpo_beta: 0.1
  max_prompt_length: 1024
  max_completion_length: 512
  gradient_checkpointing: true
  eval_every: 0
  save_every: 5
  wandb:
    enabled: false
    project: "grpo-math"
    run_name: "trl-grpo-question-qwen35-overnight"
  debug_rollouts:
    enabled: false
